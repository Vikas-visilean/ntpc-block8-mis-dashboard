<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KP Project Portfolio</title>
<style>
/* ---------- tokens (format of the VisiLean LPS portfolio view) ---------- */
:root{
  --page:#f7f9fc; --card:#ffffff; --ink:#0a2540; --ink-2:#2a3a55; --muted:#5b6b82; --faint:#8592a6;
  --line:#e3e8f0; --inset:#eef1f6; --tag:#f1f3f7;
  --navy:#002d62; --cyan:#00618a; --brand:#0e8bdf; --brand-2:#00a3e0; --spark:rgba(0,163,224,.12);
  --good:#00a455; --good-ink:#00713a; --good-bg:#e6f6ee;
  --warn:#f59e00; --warn-ink:#a66a00; --warn-bg:#fef4e6;
  --bad:#ff4343;  --bad-ink:#c42121;  --bad-bg:#ffecec;
  --inert:#8592a6; --inert-ink:#5b6b82; --inert-bg:#eef1f6;
  --c-act:#0e8bdf; --c-plan:#5b6b82; --c-fc:#00a3e0; --c-status:#f59e00; --tick:#0a2540; --plan-seg:#b4bfce;
  --hero-1:#002d62; --hero-2:#0a3566; --hero-3:#00507a;
  --on-hero:#ffffff; --on-hero-2:rgba(255,255,255,.72); --glass:rgba(255,255,255,.09); --glass-line:rgba(255,255,255,.12);
  --tip-bg:#0a2540; --tip-fg:#ffffff;
  --shadow:0 1px 2px rgba(10,37,64,.04);
  --ease:cubic-bezier(.2,0,0,1);
  --appbar-h:68px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --page:#0a1220; --card:#101a2b; --ink:#eef3fa; --ink-2:#c9d4e3; --muted:#93a3b8; --faint:#73849b;
  --line:#1e2a3d; --inset:#18243a; --tag:#18243a;
  --navy:#0b2a52; --cyan:#4fb6e6; --brand:#3fb0f0; --brand-2:#3fb0f0; --spark:rgba(63,176,240,.16);
  --good:#2fc27e; --good-ink:#5fd99d; --good-bg:rgba(0,164,85,.16);
  --warn:#f5b13a; --warn-ink:#f9c566; --warn-bg:rgba(245,158,0,.16);
  --bad:#ff6b6b;  --bad-ink:#ff8e8e;  --bad-bg:rgba(255,67,67,.16);
  --inert:#73849b; --inert-ink:#93a3b8; --inert-bg:#18243a;
  --c-act:#3fb0f0; --c-plan:#93a3b8; --c-fc:#3fb0f0; --c-status:#f5b13a; --tick:#eef3fa; --plan-seg:#3b4b63;
  --hero-1:#061c3a; --hero-2:#0a2a50; --hero-3:#0a3f5f;
  --tip-bg:#eef3fa; --tip-fg:#0a1220;
  --shadow:none;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0}
/* opens at 90%; print stays at full size */
@media screen{html{zoom:.9}}
body{background:var(--page);color:var(--ink);font:14px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;min-height:100dvh}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.wrap{max-width:1360px;margin:0 auto;padding:0 24px}
@media (max-width:760px){.wrap{padding:0 14px}}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}

/* ---------- header ---------- */
.appbar{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line)}
.appbar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding-top:12px;padding-bottom:12px}
.appbar .who .eyebrow{color:var(--cyan);text-transform:none;font-size:11px;letter-spacing:0}
.apptitle{font-size:18px;font-weight:800;letter-spacing:-.01em;margin:0;color:var(--ink);text-transform:uppercase}
.appmeta{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.appmeta img{width:28px;height:28px;border-radius:6px}
.pillbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-2);
  transition:background-color .12s var(--ease),transform .12s var(--ease)}
.pillbtn:hover{background:var(--inset)}
.pillbtn:active{transform:scale(.985)}
.pillbtn svg{width:14px;height:14px}
.thm{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);transition:background-color .12s,transform .12s}
.thm:hover{background:var(--inset)}.thm:active{transform:scale(.94)}
.thm svg{width:15px;height:15px}
:root[data-theme="dark"] .thm{color:#f5b13a}

/* ---------- hero ---------- */
main{padding-top:24px;padding-bottom:calc(48px + env(safe-area-inset-bottom))}
.hero{border-radius:16px;padding:26px 24px;color:var(--on-hero);display:flex;flex-wrap:wrap;gap:18px 24px;align-items:center;
  background:linear-gradient(100deg,var(--hero-1) 0%,var(--hero-2) 55%,var(--hero-3) 100%)}
.hero .eyebrow{color:var(--on-hero-2)}
.hero h2{margin:6px 0 0;font-size:34px;line-height:1.05;font-weight:800;letter-spacing:-.02em;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.hero h2 span{font-size:16px;font-weight:600;letter-spacing:0;color:var(--on-hero-2)}
.glassrow{margin-left:auto;display:flex;gap:12px;flex-wrap:wrap}
.glass{background:var(--glass);border:1px solid var(--glass-line);border-radius:12px;padding:12px 16px;min-width:120px}
.glass .eyebrow{color:var(--on-hero-2);font-size:10.5px}
.glass .v{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-top:2px;font-variant-numeric:tabular-nums}
.glass .s{font-size:11.5px;color:var(--on-hero-2)}
@media (max-width:760px){.hero h2{font-size:28px}.glassrow{margin-left:0;width:100%}.glass{flex:1 1 130px}}

/* ---------- toolbar ---------- */
.toolbar{position:sticky;top:var(--appbar-h);z-index:20;background:var(--page);padding:16px 0 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{position:relative;flex:0 1 320px;min-width:240px}
.search svg{position:absolute;left:11px;top:50%;width:15px;height:15px;transform:translateY(-50%);color:var(--faint)}
.search input{width:100%;height:34px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 12px 0 33px;font-size:13.5px;color:var(--ink)}
.search input::placeholder{color:var(--faint)}
.dd{height:34px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 30px 0 12px;font-size:13px;font-weight:600;color:var(--ink-2);
  appearance:none;-webkit-appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);
  background-position:calc(100% - 16px) 15px,calc(100% - 11px) 15px;background-size:5px 5px;background-repeat:no-repeat}
.dd.on{border-color:var(--brand);color:var(--brand)}
.sorts{margin-left:auto;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.sorts svg{width:15px;height:15px;color:var(--faint);margin-right:4px}
.sorts button{border:0;background:var(--card);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;color:var(--ink-2);cursor:pointer;
  transition:background-color .12s var(--ease)}
.sorts button:hover{background:var(--inset)}
.sorts button[aria-pressed="true"]{background:var(--navy);color:#fff}
:root[data-theme="dark"] .sorts button[aria-pressed="true"]{background:var(--brand);color:var(--page)}
.clear{border:0;background:none;color:var(--brand);font-size:12.5px;font-weight:600;cursor:pointer;padding:4px}
.clear[hidden]{display:none}
.count{font-size:12px;color:var(--muted)}
@media (max-width:760px){.toolbar{position:static}.sorts{margin-left:0}.search{flex:1 1 100%}}

/* ---------- project rows ---------- */
.rows{display:flex;flex-direction:column;gap:12px}
.prow{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);
  display:grid;grid-template-columns:132px minmax(0,1fr) 340px 150px 24px;gap:18px;align-items:center;
  transition:border-color .12s var(--ease)}
.prow:hover{border-color:var(--faint)}
@media (max-width:1100px){.prow{grid-template-columns:132px minmax(0,1fr) 24px}.prow .bars{grid-column:1/-1}.prow .spark{grid-column:1/-1}.prow .go{grid-row:1;grid-column:3}}
.rgroup{display:flex;flex-direction:column;gap:12px}
.rgroup+.rgroup{margin-top:14px}
.rgh{display:flex;align-items:baseline;gap:10px;padding:0 2px}
.rgh h3{margin:0;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--navy)}
:root[data-theme="dark"] .rgh h3{color:var(--brand)}
.rgh span{font-size:12px;color:var(--muted)}
.gauge{width:132px;text-align:center}
.gauge svg{width:120px;height:64px;display:block;margin:0 auto;overflow:visible}
.gauge path{fill:none;stroke-width:11;stroke-linecap:butt}
.gauge .bg{stroke:var(--inset)}
.gauge .pl{stroke:var(--plan-seg)}
.gauge .cap{fill:var(--plan-seg)}
.gauge .ac.good{stroke:var(--good)} .gauge .ac.warn{stroke:var(--warn)} .gauge .ac.bad{stroke:var(--bad)} .gauge .ac.inert{stroke:var(--inert)}
.gauge text.v{font-size:17px;font-weight:800;fill:var(--ink);font-variant-numeric:tabular-nums;font-family:inherit}
.gauge .gl{display:flex;justify-content:center;gap:8px;margin-top:4px;font-size:10.5px;color:var(--muted);white-space:nowrap}
.gauge .gl b{color:var(--ink);font-weight:800}
.gauge .gl i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:3px;vertical-align:-1px}
.gauge .gl i.pl{background:var(--plan-seg)}
.gauge .gl i.ac.good{background:var(--good)} .gauge .gl i.ac.warn{background:var(--warn)} .gauge .gl i.ac.bad{background:var(--bad)} .gauge .gl i.ac.inert{background:var(--inert)}
.info{min-width:0}
.ttl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ttl svg.ic{width:15px;height:15px;color:var(--cyan);flex:none}
.ttl a.nm{font-size:15.5px;font-weight:800;color:var(--ink);text-decoration:none;letter-spacing:-.005em}
.ttl a.nm:hover{text-decoration:underline}
.ttl a.nm .mw{font-size:13.5px;font-weight:700;color:var(--ink-2);margin-left:8px}
.ttl a.nm .loc{font-size:12px;font-weight:500;color:var(--muted);margin-left:8px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;text-transform:uppercase;border-radius:6px;padding:2px 7px;white-space:nowrap;letter-spacing:.01em}
.badge svg{width:11px;height:11px;flex:none}
.b-good{color:var(--good-ink);background:var(--good-bg)}
.b-warn{color:var(--warn-ink);background:var(--warn-bg)}
.b-bad{color:var(--bad-ink);background:var(--bad-bg)}
.b-inert{color:var(--inert-ink);background:var(--inert-bg)}
.facts{font-size:12.5px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 14px}
.facts b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
.mb{min-width:0}
.mb .top{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:5px}
.mb .top span{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.mb .top b{font-size:12.5px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.mb .top b em{font-style:normal;font-weight:600;color:var(--faint);font-size:11px}
.spark{text-align:center;min-width:0}
.spark svg{width:100%;max-width:150px;height:48px;display:block;margin:0 auto}
.spark .ar{fill:var(--spark)} .spark .ln{fill:none;stroke:var(--brand-2);stroke-width:1.6}
.spark .dt{fill:var(--ink)}
.spark .cap{font-size:11.5px;color:var(--muted);margin-top:2px}
.spark .cap b{color:var(--ink);font-weight:700}
.go{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:999px;color:var(--muted);text-decoration:none;
  transition:background-color .12s var(--ease),color .12s var(--ease)}
.go:hover{background:var(--inset);color:var(--ink)}
.go svg{width:16px;height:16px}

/* ---------- sections ---------- */
section{margin-top:32px}
.sh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.sh h2{font-size:16px;font-weight:800;margin:0;color:var(--ink)}
.sh p{font-size:12.5px;color:var(--muted);margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:14.5px;font-weight:800;margin:2px 0 0;color:var(--ink)}
.ch{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ch p{font-size:12px;color:var(--muted);margin:3px 0 0}
.ch .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.foot{font-size:11.5px;color:var(--faint);margin:12px 0 0}
.empty{font-size:13px;color:var(--muted);padding:26px 4px;text-align:center;background:var(--card);border:1px dashed var(--line);border-radius:14px}
.card .empty{border:0;background:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);align-items:center}
.legend .sw{display:inline-block;width:12px;height:6px;border-radius:999px;background:var(--c-act);margin-right:5px;vertical-align:middle}
.legend .tick{display:inline-block;width:2px;height:12px;background:var(--tick);margin:0 6px 0 2px;vertical-align:middle;border-radius:2px}
.legend .ln{display:inline-block;width:16px;height:0;border-top:2px solid var(--c-act);margin-right:5px;vertical-align:middle}
.legend .ln.plan{border-top-color:var(--c-plan)}
.legend .ln.fc{border-top:2px dashed var(--c-fc);opacity:.75}

.epcsum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:900px){.epcsum{grid-template-columns:1fr}}
.epct{display:flex;flex-direction:column;gap:10px}
.epct .top{display:flex;align-items:center;gap:8px}
.epct .top .badge{margin-left:auto}
.epct .big{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.epct .big small{font-size:15px;font-weight:700;margin-left:1px}
.epct .big small.pl{font-size:20px;color:var(--muted);margin-left:4px}
.epct .of{font-size:12px;color:var(--muted)}
.epct .split{display:flex;flex-direction:column;gap:7px;margin-top:2px}
.epct .split div{display:grid;grid-template-columns:96px 1fr 84px;gap:8px;align-items:center;font-size:11.5px;color:var(--muted)}
.stk{position:relative;height:8px;border-radius:999px;background:var(--inset);overflow:hidden}
.stk.thick{height:12px}
.stk i{position:absolute;top:0;bottom:0}
.stk.sm{height:6px}
.stk i.a{left:0;background:var(--good)}
.stk i.a.warn{background:var(--warn)} .stk i.a.bad{background:var(--bad)} .stk i.a.inert{background:var(--inert)}
.stk i.g,.stk i.p{border-radius:0 999px 999px 0}
.stk i.g{background:var(--warn)}
.stk i.p{background:var(--plan-seg)}
.stk[tabindex]:hover,.stk[tabindex]:focus-visible{filter:brightness(1.06)}
.epct .split div b{text-align:right;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}

.dim{color:var(--faint)}
.neg{color:var(--bad-ink)} .pos{color:var(--good-ink)}

svg.chart{width:100%;height:auto;display:block;overflow:visible}
.scx{flex:1;min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.scx svg.chart{max-width:none}
.chart text{font-size:10.5px;fill:var(--faint);font-variant-numeric:tabular-nums;font-family:inherit}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .plan{fill:none;stroke:var(--c-plan);stroke-width:2}
.chart .fc{fill:none;stroke:var(--c-fc);stroke-width:1.5;stroke-dasharray:5 4;opacity:.75}
.chart .act{fill:none;stroke:var(--c-act);stroke-width:2.2}
.chart .area{fill:var(--c-act);opacity:.10}
.chart .mk{fill:var(--c-act);stroke:var(--card);stroke-width:2}
.chart .today{stroke:var(--c-status);stroke-width:1;stroke-dasharray:3 3}
.chart .todaylab{fill:var(--c-status);font-weight:700}
.chart .lab{fill:var(--ink);font-weight:800;font-size:11.5px}
.chart .lab.plan-l{fill:var(--muted);font-weight:600}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .hit:focus{outline:none}
.chart .hit:focus-visible{fill:var(--spark)}
.chart .crosshair{stroke:var(--faint);stroke-width:1}
.seg{display:inline-flex;border-radius:999px;padding:2px;background:var(--inset)}
.seg button{border:0;background:none;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;transition:background-color .12s var(--ease)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:var(--brand);color:var(--page)}
.statline{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:10px}
.statline .v{font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.statline .v small{font-size:13px;color:var(--faint);font-weight:600}

#tip{position:fixed;z-index:9999;pointer-events:none;background:var(--tip-bg);color:var(--tip-fg);font-size:12px;line-height:1.45;
  padding:7px 10px;border-radius:8px;max-width:280px;white-space:pre-line;opacity:0;transform:translateY(2px);
  transition:opacity .09s var(--ease),transform .09s var(--ease);font-variant-numeric:tabular-nums}
#tip.on{opacity:1;transform:none}
.srOnly{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}}
</style>
</head>
<body>
<header class="appbar" id="appbar">
  <div class="wrap">
    <div class="who">
      <div class="eyebrow">KP Group · all projects</div>
      <h1 class="apptitle">Project Portfolio</h1>
    </div>
    <div class="appmeta">

const pct = v => isNum(v) ? pctN(v)+"%" : "—";
const n0 = v => isNum(v) ? Math.round(v).toLocaleString("en-IN") : "—";
const mwF = v => isNum(v) ? (Math.round(v*100)/100).toLocaleString("en-IN") : "—";
const pts = v => isNum(v) ? (v>0?"+":v<0?"−":"") + pctN(Math.abs(v)) + "%" : "—";
function dLong(iso){ if(!iso) return "—"; const [y,m,d]=iso.slice(0,10).split("-").map(Number); return d+" "+MON[m-1]+" "+y; }
function dDay(iso){ const [,m,d]=iso.split("-").map(Number); return d+" "+MON[m-1]; }
const mLabel = ym => { const [y,m]=ym.split("-").map(Number); return MON[m-1]+" "+String(y).slice(2); };
const daysBetween = (a,b) => Math.round((Date.parse(b)-Date.parse(a))/864e5);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));

/* ---------- status ---------- */
const ICON = {
  good:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>',
  warn:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 2.5l6 11H2z"/><path d="M8 7v3"/><path d="M8 12h.01"/></svg>',
  bad:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 5v3.5"/><path d="M8 11h.01"/></svg>',
  inert:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8h8"/></svg>'
};
const badge = (k,txt,icon=true) => `<span class="badge b-${k}">${icon?ICON[k]:""}${esc(txt)}</span>`;
function spiStatus(spi){ if(!isNum(spi)) return ["inert","No plan yet"]; if(spi>=.95) return ["good","On track"]; if(spi>=.8) return ["warn","Behind"]; return ["bad","Critical"]; }
function gapStatus(plan,act){ if(!isNum(plan)||!isNum(act)) return ["inert","Not in scope"]; const g=plan-act;
  if(g<=2) return ["good","On plan"]; if(g<=10) return ["warn","Behind"]; return ["bad","Well behind"]; }

/* ---------- filters + sort ---------- */
const capBand = mw => mw<=100 ? "Up to 100 MW" : mw<=250 ? "101–250 MW" : "Above 250 MW";
const GROUPS = [
  {k:"cap", label:"Capacity", get:p=>capBand(p.mw), order:["Up to 100 MW","101–250 MW","Above 250 MW"]},
  {k:"loc", label:"Location", get:p=>p.site+", "+p.state},
  {k:"contract", label:"Type of project", get:p=>p.contract},
];
const state = {f:Object.fromEntries(GROUPS.map(g=>[g.k,""])), q:"", sort:"attn", scProj:"all", scPhase:"all", scGran:"month"};
const qHit = p => !state.q || (p.name+" "+p.full+" "+p.site+" "+p.state+" "+p.type).toLowerCase().includes(state.q.toLowerCase());
const matches = (p,skip) => qHit(p) && GROUPS.every(g => g.k===skip || !state.f[g.k] || state.f[g.k]===g.get(p));
const inView = () => P.filter(p => matches(p));
function filterText(){
  const parts = GROUPS.filter(g=>state.f[g.k]).map(g=>g.label+": "+state.f[g.k]);
  if(state.q) parts.unshift("“"+state.q+"”");
  return parts.join(" · ");
}
const emptyMsg = what => `<div class="empty">No ${what} match ${filterText() ? esc(filterText()) : "the current filters"}.</div>`;
const SORTS = {
  attn:(a,b)=>(isNum(a.spi)?a.spi:9)-(isNum(b.spi)?b.spi:9),
  health:(a,b)=>(isNum(b.spi)?b.spi:-1)-(isNum(a.spi)?a.spi:-1),
  mw:(a,b)=>b.mw-a.mw,
  az:(a,b)=>a.name.localeCompare(b.name),
};
function renderToolbar(){
  let h = "";
  GROUPS.forEach(g => {
    let vals = [...new Set(P.map(g.get))];
    vals.sort(g.order ? (a,b)=>g.order.indexOf(a)-g.order.indexOf(b) : (a,b)=>a.localeCompare(b));
    const cur = state.f[g.k];
    h += `<label class="srOnly" for="dd-${g.k}">${esc(g.label)}</label><select class="dd${cur?" on":""}" id="dd-${g.k}" data-g="${g.k}">
      <option value="">${esc(g.label)}: all</option>` +
      vals.map(v => { const ct = P.filter(p=>matches(p,g.k) && g.get(p)===v).length;
        return `<option value="${esc(v)}"${v===cur?" selected":""}>${esc(v)} (${ct})</option>`; }).join("") + `</select>`;
  });
  document.getElementById("dds").innerHTML = h;
  const S = inView();
  document.getElementById("count").textContent = `${S.length} of ${P.length} projects`;
  document.getElementById("clearAll").hidden = !(state.q || GROUPS.some(g=>state.f[g.k]));
  document.querySelectorAll(".sorts button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.s===state.sort)));
}
document.getElementById("dds").addEventListener("change", e => {
  const s = e.target.closest("select"); if(!s) return;
  state.f[s.dataset.g] = s.value; render(); document.getElementById("dd-"+s.dataset.g).focus();
});
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value.trim(); render(); });
document.getElementById("clearAll").addEventListener("click", () => {
  GROUPS.forEach(g=>state.f[g.k]=""); state.q=""; document.getElementById("q").value=""; render(); document.getElementById("q").focus();
});
document.querySelector(".sorts").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return; state.sort = b.dataset.s; renderToolbar(); renderRows(inView());
});

/* ---------- aggregation ---------- */
function wavg(list, val){ let s=0,w=0; list.forEach(p=>{ const v=val(p); if(isNum(v)){ s+=v*p.mw; w+=p.mw; } }); return w ? s/w : null; }
/* stacked bar: actual · actual-to-plan segment (rounded end) · remaining to 100% (track grey)
   o.st colours the actual part (default green); o.seg is "g" (amber shortfall) or "p" (plan grey) */
function stack(act, plan, tip, o={}){
  const a = isNum(act) ? clamp(act,0,100) : 0, p = isNum(plan) ? clamp(plan,0,100) : a, gap = Math.max(0, p-a);
  return `<div class="stk${o.thick?" thick":""}${o.sm?" sm":""}" tabindex="0" data-tip="${esc(tip)}" aria-label="${esc(tip.replace(/\n/g,", "))}"><i class="a ${o.st||""}" style="width:${a}%"></i>${gap?`<i class="${o.seg||"g"}" style="left:${a}%;width:${gap}%"></i>`:""}</div>`;
}
const actPlan = (act, plan) => `${isNum(act)?pctN(act)+"%":"—"}/${isNum(plan)?pctN(plan)+"%":"—"}`;

/* ---------- hero ---------- */

    </div>

      <div class="glass" tabindex="0" data-tip="Actual ÷ Plan, capacity-weighted"><div class="eyebrow">Portfolio SPI</div><div class="v">${isNum(plan)&&plan>.05?(act/plan).toFixed(2):"—"}</div><div class="s">schedule performance</div></div>
      <div class="glass" tabindex="0" data-tip="${g6?`Progress gained since ${mLabel(g6.from)}, capacity-weighted\nActual ${pts(g6.aGain)} · Plan ${pts(g6.pGain)}`:"No progress data"}"><div class="eyebrow">Gained · 6 mo</div><div class="v">${g6?pts(g6.aGain).replace("%",""):"—"}<small style="font-size:13px">%</small></div><div class="s">${g6?"Plan "+pts(g6.pGain):"—"}</div></div>
      <div class="glass" tabindex="0" data-tip="Projects with SPI under 0.95"><div class="eyebrow">Need attention</div><div class="v">${attn}</div><div class="s">SPI under 0.95</div></div>

/* ---------- project rows ---------- */
/* half-circle gauge, 0% on the left to 100% on the right: plan arc (rounded end) behind, actual arc on top */
function gauge(p){
  const [k] = spiStatus(p.spi), r = 46, cx = 60, cy = 58;
  const pt = f => [cx - r*Math.cos(Math.PI*f), cy - r*Math.sin(Math.PI*f)];
  const arc = v => { const f = clamp(isNum(v)?v:0,0,100)/100; if(f<=0) return ""; const [x,y] = pt(f);
    return `M${cx-r} ${cy} A${r} ${r} 0 0 1 ${x.toFixed(2)} ${y.toFixed(2)}`; };
  const fp = clamp(isNum(p.plan)?p.plan:0,0,100)/100, [px,py] = pt(fp);
  return `<div class="gauge" tabindex="0" data-tip="${esc(`${p.name}\nActual ${pct(p.act)} · Plan ${pct(p.plan)}\nGap ${pts(isNum(p.act)&&isNum(p.plan)?p.act-p.plan:null)} · SPI ${isNum(p.spi)?p.spi.toFixed(2):"—"}\n${spiStatus(p.spi)[1]}`)}">
    <svg viewBox="0 0 120 64" aria-hidden="true"><path class="bg" d="${arc(100)}"/><path class="pl" d="${arc(p.plan)}"/>${fp>0?`<circle class="cap" cx="${px.toFixed(2)}" cy="${py.toFixed(2)}" r="5.5"/>`:""}<path class="ac ${k}" d="${arc(p.act)}"/>
      <text class="v" x="${cx}" y="${cy-4}" text-anchor="middle">${pct(p.act)}</text></svg>
    <div class="gl num"><span><i class="ac ${k}"></i>Actual <b>${pct(p.act)}</b></span><span><i class="pl"></i>Plan <b>${pct(p.plan)}</b></span></div></div>`;
}
function spark(p){
  const d = win6(scSeries([p],"all","all"));
  if(!d) return `<div class="spark"><div class="cap">—</div></div>`;
  const A = d.act, n = A.length, w = 150, h = 44, pad = 3;
  const lo = Math.min(...[d.base,...A].filter(isNum)), hi = Math.max(...[d.base,...A].filter(isNum)), rg = Math.max(1, hi-lo);
  const X = i => pad + (w-2*pad)*i/(n-1), Y = v => pad + (h-2*pad)*(1-(v-lo)/rg);
  const idx = A.map((v,i)=>isNum(v)?i:-1).filter(i=>i>=0);
  const line = idx.map((i,j)=>(j?"L":"M")+X(i).toFixed(1)+" "+Y(A[i]).toFixed(1)).join(" ");
  const area = idx.length ? `M${X(idx[0]).toFixed(1)} ${h-pad} ` + idx.map(i=>"L"+X(i).toFixed(1)+" "+Y(A[i]).toFixed(1)).join(" ") + ` L${X(idx[idx.length-1]).toFixed(1)} ${h-pad} Z` : "";
  const li = idx[idx.length-1];
  const tip = `${p.name} · actual progress, last 6 months\nGained: Actual ${pts(d.aGain)} · Plan ${pts(d.pGain)}\n` + d.months.map((m,i)=>`${mLabel(m)}: Actual ${pct(A[i])} · Plan ${pct(d.plan[i])}`).join("\n");
  return `<div class="spark" tabindex="0" data-tip="${esc(tip)}">
    <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path class="ar" d="${area}"/><path class="ln" d="${line}"/>${li!==undefined?`<circle class="dt" cx="${X(li)}" cy="${Y(A[li])}" r="2.6"/>`:""}</svg>
    <div class="cap">Actual · last 6 months</div></div>`;
}
function metric(label, e){
  if(!e) return `<div class="mb"><div class="top"><span>${label}</span><b class="dim">—</b></div><div class="stk sm"></div></div>`;
  const [k,t] = gapStatus(e.plan,e.act);
  return `<div class="mb"><div class="top"><span>${label}</span><b>${pct(e.act)}<em>/${pct(e.plan)}</em></b></div>
    ${stack(e.act,e.plan,`${label}\nActual ${pct(e.act)} · Plan ${pct(e.plan)}\n${t} (${pts(e.act-e.plan)})\n${n0(e.n)} activities`,{sm:true,st:k,seg:"p"})}</div>`;
}
const ICON_SITE = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1"/></svg>';
function renderRows(S){
  const el = document.getElementById("rows");
  if(!S.length){ el.innerHTML = emptyMsg("projects"); return; }
  const types = [...new Set(S.map(p=>p.type))].sort((a,b)=>(TYPE_ORDER.indexOf(a)+1||99)-(TYPE_ORDER.indexOf(b)+1||99) || a.localeCompare(b));
  el.innerHTML = types.map(ty => {
    const G = S.filter(p=>p.type===ty), mw = G.reduce((a,p)=>a+p.mw,0);
    return `<div class="rgroup" role="group" aria-label="${esc(ty)} projects"><div class="rgh"><h3>${esc(ty)}</h3><span class="num">${G.length} project${G.length===1?"":"s"} · ${mwF(mw)} MW</span></div>` +
      G.sort(SORTS[state.sort]).map(rowHTML).join("") + `</div>`;
  }).join("");
}
const TYPE_ORDER = ["Solar","Wind"];
function rowHTML(p){
  const [k,t] = spiStatus(p.spi);
  const days = p.codForecast ? daysBetween(p.statusIso,p.codForecast) : null;
  let badges = badge(k,t);
  if(isNum(days) && days<=90) badges += badge("warn", `COD in ${days} days`);
  return `<article class="prow">
    ${gauge(p)}
    <div class="info">
      <div class="ttl">${ICON_SITE}<a class="nm" href="${esc(p.href)}">${esc(p.name)}<span class="mw num">${mwF(p.mw)} MW</span><span class="loc">${esc(p.site)}, ${esc(p.state)}</span></a>${badges}</div>
      <div class="facts num"><span><b>${n0(p.total)}</b> activities</span><span><b>${n0(p.done)}</b> complete</span><span>COD <b>${esc(dLong(p.codForecast))}</b></span></div>
    </div>
    <div class="bars">${metric("Engineering",p.epc.E)}${metric("Procurement",p.epc.P)}${metric("Construction",p.epc.C)}${metric("Overall",{plan:p.plan,act:p.act,n:p.total})}</div>
    ${spark(p)}
    <a class="go" href="${esc(p.href)}" aria-label="Open ${esc(p.name)} dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
  </article>`;
}

/* ---------- EPC ---------- */
function renderEPC(S){
  const el = document.getElementById("epc");
  if(!S.length){ el.innerHTML = emptyMsg("projects"); return; }
  el.innerHTML = ["E","P","C"].map(k => {
    const inScope = S.filter(p=>p.epc[k]);
    const plan = wavg(inScope,p=>p.epc[k].plan), act = wavg(inScope,p=>p.epc[k].act);
    const [bk,bt] = gapStatus(plan,act);
    const split = inScope.slice().sort((a,b)=>b.epc[k].act-a.epc[k].act).map(p => {
      const e=p.epc[k], [sk,stx]=gapStatus(e.plan,e.act);
      return `<div><span>${esc(p.name)}</span>${stack(e.act,e.plan,`${p.name} · ${PH[k]}\nActual ${pct(e.act)} · Plan ${pct(e.plan)}\n${stx}`)}<b>${actPlan(e.act,e.plan)}</b></div>`; }).join("");
    return `<div class="card epct"><div class="top"><div class="eyebrow">${PH[k]}</div>${badge(bk,bt)}</div>
      <div><div class="big">${pctN(act)}<small>%</small><small class="pl"> / ${pct(plan)}</small></div><div class="of num">Actual / Plan · Gap ${pts(isNum(act)&&isNum(plan)?act-plan:null)}</div></div>
      ${stack(act,plan,`${PH[k]} · portfolio\nActual ${pct(act)}\nPlan ${pct(plan)}`,{thick:true})}
      <div class="split">${split}</div></div>`;
  }).join("") + `<div class="legend" style="grid-column:1/-1"><span><span class="sw" style="background:var(--good)"></span>Actual</span><span><span class="sw" style="background:var(--warn)"></span>Actual → Plan shortfall</span><span><span class="sw" style="background:var(--inset);box-shadow:inset 0 0 0 1px var(--line)"></span>Remaining to 100%</span><span>Values: Actual/Plan</span>
    <span>${badge("good","On plan")} within 2%</span><span>${badge("warn","Behind")} 2–10%</span><span>${badge("bad","Well behind")} over 10%</span>
    <span>Split by VisiLean Activity Type · Procurement = Supply + Services</span></div>`;
}

/* ---------- charts ---------- */
const VB = {w:1200,h:300,l:42,r:18,t:14,b:30};
function niceStep(raw){ if(raw<=0) return 1; const k=Math.pow(10,Math.floor(Math.log10(raw)));
  for(const m of [1,2,2.5,5,10]){ if(m*k>=raw) return Math.max(1,m*k); } return 10*k; }
/* gran "month": month-end series (months/sc) · "week": week-ending series (weeks/wsc), weeks end on the data-date weekday */
function scSeries(S, scope, phase, gran){
  const wk = gran==="week", KL = wk ? "weeks" : "months", KS = wk ? "wsc" : "sc";
  const list = (scope==="all" ? S : S.filter(p=>p.id===scope)).filter(p=>p[KS] && p[KS][phase]);
  if(!list.length) return null;
  const months = [...new Set(list.flatMap(p=>p[KL]))].sort();
  const statusM = list.map(p=>wk ? p.statusIso : p.statusIso.slice(0,7)).sort().slice(-1)[0];
  const val = (p, m, key) => {
    const s = p[KS][phase][key], i = p[KL].indexOf(m);
    if(key==="act" && m>statusM) return null;
    if(i>=0) return s[i];
    if(m < p[KL][0]) return 0;
    for(let j=s.length-1;j>=0;j--) if(s[j]!==null) return s[j];
    return null;
  };
  const agg = key => months.map(m => { let a=0,w=0; list.forEach(p=>{const v=val(p,m,key); if(isNum(v)){a+=v*p.mw;w+=p.mw}}); return w?a/w:null; });
  /* plan AT the data date - the month-end point of the data-date month is plan at that month's END */
  const planAt = wavg(list, p=>p.epc && p.epc[phase] ? p.epc[phase].plan : null);
  return {months, plan:agg("plan"), fc:agg("fc"), act:agg("act"), planAt, statusM, week:wk};
}
function scopeOptions(sel, S, cur){
  sel.innerHTML = `<option value="all">Portfolio (${S.length})</option>` + S.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("");
  sel.value = cur;
}
/* last 6 month-ends up to the data date; gain is measured from the month-end before the window */
function win6(d){
  if(!d) return null;
  const si = d.months.indexOf(d.statusM); if(si<0) return null;
  const a = Math.max(0, si-5), b = si-6;
  const pick = arr => arr.slice(a, si+1);
  const base = b>=0 ? d.act[b] : 0, pBase = b>=0 ? d.plan[b] : 0;
  const act = pick(d.act), plan = pick(d.plan);
  if(isNum(d.planAt)) plan[plan.length-1] = d.planAt;   // last point is the data date, like act
  return {months:pick(d.months), plan, fc:pick(d.fc), act, statusM:d.statusM, base, from:b>=0?d.months[b]:d.months[0],
    aGain: isNum(act[act.length-1])&&isNum(base) ? act[act.length-1]-base : null,
    pGain: isNum(plan[plan.length-1])&&isNum(pBase) ? plan[plan.length-1]-pBase : null};
}
const WEEK_PX = 20;
const wLabel = iso => { const [y,m,dd]=iso.split("-").map(Number); return String(dd).padStart(2,"0")+" "+MON[m-1]+" "+String(y).slice(2); };
function drawSC(d, opt){
  /* weekly: the y-axis is a separate fixed svg (width VB.l) so it stays put while the weeks scroll */
  const wk = d.week, n=d.months.length, {r,t,b} = VB, l = wk ? 12 : VB.l, ih = VB.h-t-b;
  const w = wk ? Math.max((opt.minW||VB.w) - VB.l, l + r + (n-1)*WEEK_PX + 24) : VB.w, h = wk ? VB.h + 40 : VB.h, iw = w-l-r;
  const vals = [...d.plan,...d.fc,...d.act].filter(isNum);
  const ymin = 0, step = niceStep(Math.max(1,...vals)/4), ymax = step*4;
  const X = i => l + (n>1 ? iw*i/(n-1) : iw/2), Y = v => t + ih*(1-(v-ymin)/(ymax-ymin));
  const path = arr => { let s="", pen=false; arr.forEach((v,i)=>{ if(!isNum(v)){pen=false;return} s+=(pen?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)+" "; pen=true; }); return s.trim(); };
  let g = `<svg class="chart" viewBox="0 0 ${w} ${h}"${wk?` style="width:${w}px"`:""} role="img" aria-label="${esc(opt.label)}">`;
  let yax = `<svg class="chart" viewBox="0 0 ${VB.l} ${h}" style="width:${VB.l}px;flex:none" aria-hidden="true">`;
  for(let k=0;k<=4;k++){ const v=ymin+step*k, lab=`<text x="${VB.l-8}" y="${Y(v)+3.5}" text-anchor="end">${pctN(v)}%</text>`;
    g+=`<line class="grid" x1="${l}" x2="${w-r}" y1="${Y(v)}" y2="${Y(v)}"/>${wk?"":lab}`; yax+=lab; }
  yax += `</svg>`;
  if(wk) d.months.forEach((m,i)=>{ g+=`<text transform="translate(${X(i)+3} ${t+ih+12}) rotate(-45)" text-anchor="end">${wLabel(m)}</text>`; });
  else { const every = Math.ceil(n/8);
    d.months.forEach((m,i)=>{ if(i%every===0 || i===n-1) g+=`<text x="${X(i)}" y="${h-10}" text-anchor="middle">${mLabel(m)}</text>`; }); }
  const si = d.months.indexOf(d.statusM);
  if(si>=0) g+=`<line class="today" x1="${X(si)}" x2="${X(si)}" y1="${t}" y2="${t+ih}"/><text class="todaylab" x="${X(si)+(si===n-1?-4:4)}" y="${t+9}"${si===n-1?' text-anchor="end"':""}>Data date</text>`;
  g += `<path class="plan" d="${path(d.plan)}"/><path class="fc" d="${path(d.fc)}"/>`;
  const ai = d.act.map((v,i)=>isNum(v)?i:-1).filter(i=>i>=0);
  if(ai.length){
    const a0=ai[0], a1=ai[ai.length-1], end = a1===n-1 ? -8 : 8, anc = a1===n-1 ? ' text-anchor="end"' : "";
    g += `<path class="area" d="${path(d.act)} L ${X(a1)} ${Y(ymin)} L ${X(a0)} ${Y(ymin)} Z"/><path class="act" d="${path(d.act)}"/>`;
    ai.forEach(i=>{ if(!wk || i===a1) g+=`<circle class="mk" cx="${X(i)}" cy="${Y(d.act[i])}" r="${i===a1?5:4}"/>`; });
    g += `<text class="lab" x="${X(a1)+end}" y="${Y(d.act[a1])+(a1===n-1?16:4)}"${anc}>${pct(d.act[a1])}</text>`;
    const pl = d.months[a1]===d.statusM && isNum(d.planAt) ? d.planAt : d.plan[a1];
    if(isNum(pl)) g += `<text class="lab plan-l" x="${X(a1)+end}" y="${Y(pl)-6}"${anc}>Plan ${pct(pl)}</text>`;
  }
  const cw = n>1 ? iw/(n-1) : iw;
  d.months.forEach((m,i)=>{
    const tip = `${wk ? "Week ending "+dLong(m) : mLabel(m)}\nActual ${pct(d.act[i])}\nPlan ${pct(d.plan[i])}\nForecast ${pct(d.fc[i])}`;
    g += `<rect class="hit" tabindex="0" x="${X(i)-cw/2}" y="${t}" width="${cw}" height="${ih}" data-tip="${esc(tip)}" data-x="${X(i)}"></rect>`;
  });
  g += `<line class="crosshair" x1="0" x2="0" y1="${t}" y2="${t+ih}" visibility="hidden"/></svg>`;
  if(wk) g = `<div style="display:flex">${yax}<div class="scx" data-dx="${si>=0?X(si):0}">${g}</div></div>`;
  return g + `<div class="legend" style="margin-top:8px"><span><span class="ln"></span>Actual</span><span><span class="ln plan"></span>Plan (baseline)</span><span><span class="ln fc"></span>Forecast</span></div>`;
}
function scControls(key, S){
  const pk = key+"Proj", hk = key+"Phase";
  if(state[pk]!=="all" && !S.some(p=>p.id===state[pk])) state[pk] = "all";
  scopeOptions(document.getElementById(pk), S, state[pk]);
  document.getElementById(hk).innerHTML = ["all","E","P","C"].map(k=>`<button type="button" data-k="${k}" aria-pressed="${state[hk]===k}" title="${PH[k]}">${k==="all"?"All":k}</button>`).join("");
  document.getElementById(key+"Gran").innerHTML = [["month","Monthly"],["week","Weekly"]].map(([k,t])=>`<button type="button" data-k="${k}" aria-pressed="${state[key+"Gran"]===k}">${t}</button>`).join("");
  document.getElementById(key+"-desc").textContent = `cumulative % complete · ${PH[state[hk]]} · ${state[key+"Gran"]==="week"?"week by week":"month by month"}${state[pk]==="all"?" · capacity-weighted":""}`;
}
function renderSC(S){
  scControls("sc", S);
  const el = document.getElementById("sc");
  if(!S.length){ el.innerHTML = emptyMsg("projects"); return; }
  const d = scSeries(S, state.scProj, state.scPhase, state.scGran);
  if(!d){ el.innerHTML = `<div class="empty">No ${PH[state.scPhase]} activities in the selected project.</div>`; return; }
  const si = d.months.indexOf(d.statusM), a = si>=0 ? d.act[si] : null, p = isNum(d.planAt) ? d.planAt : si>=0 ? d.plan[si] : null, gap = isNum(a)&&isNum(p) ? a-p : null;
  const asof = S.map(x=>x.statusIso).sort().slice(-1)[0];
  const h = `<div class="eyebrow" style="margin-bottom:4px">Overall progress · as of ${dLong(asof)} (data date)</div><div class="statline">
    <div><div class="v">${pct(a)}</div><div class="eyebrow">Actual</div></div>
    <div><div class="v">${pct(p)}</div><div class="eyebrow">Plan</div></div>
    <div><div class="v ${isNum(gap)&&gap<0?"neg":""}">${pts(gap)}</div><div class="eyebrow">Gap</div></div></div>`;
  el.innerHTML = h + drawSC(d, {minW: el.clientWidth, label:`S-curve, ${PH[state.scPhase]}: actual, plan and forecast cumulative progress ${d.week?"by week":"by month"}`});
  const sx = el.querySelector(".scx");
  if(sx) sx.scrollLeft = Math.max(0, +sx.dataset.dx - sx.clientWidth*0.6);
}
document.getElementById("scGran").addEventListener("click", e => { const b=e.target.closest("button"); if(!b) return; state.scGran=b.dataset.k; renderSC(inView()); document.querySelector(`#scGran button[data-k="${b.dataset.k}"]`).focus(); });
let scResize = 0;
addEventListener("resize", () => { if(state.scGran!=="week") return; clearTimeout(scResize); scResize = setTimeout(()=>renderSC(inView()), 150); });
document.getElementById("scProj").addEventListener("change", e => { state.scProj = e.target.value; renderSC(inView()); });
document.getElementById("scPhase").addEventListener("click", e => { const b=e.target.closest("button"); if(!b) return; state.scPhase=b.dataset.k; renderSC(inView()); document.querySelector(`#scPhase button[data-k="${b.dataset.k}"]`).focus(); });


/* ---------- tooltip ---------- */
const tip = document.getElementById("tip"); let tipFor = null;
function showTip(el){
  const txt = el.getAttribute("data-tip"); if(!txt) return;
  tipFor = el; tip.textContent = txt; tip.classList.add("on"); tip.setAttribute("aria-hidden","false");
  // the page runs html{zoom:.9}: getBoundingClientRect is in screen px, left/top in zoomed px
  const z = document.documentElement.currentCSSZoom || 1;
  const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = (r.left + r.width/2)/z - tw/2, y = r.top/z - th - 8; if(y < 8) y = r.bottom/z + 8;
  tip.style.left = clamp(x, 8, innerWidth/z - tw - 8) + "px"; tip.style.top = y + "px";
  const cross = el.dataset.x && el.closest("svg") && el.closest("svg").querySelector(".crosshair");
  if(cross){ cross.setAttribute("x1",el.dataset.x); cross.setAttribute("x2",el.dataset.x); cross.setAttribute("visibility","visible"); }
}
function hideTip(){ tipFor=null; tip.classList.remove("on"); tip.setAttribute("aria-hidden","true");
  document.querySelectorAll(".chart .crosshair").forEach(c=>c.setAttribute("visibility","hidden")); }
document.addEventListener("mouseover", e => { const el=e.target.closest("[data-tip]"); if(el) showTip(el); else if(tipFor) hideTip(); });
document.addEventListener("focusin", e => { const el=e.target.closest("[data-tip]"); if(el) showTip(el); else hideTip(); });
document.addEventListener("focusout", e => { if(e.target===tipFor) hideTip(); });
document.addEventListener("keydown", e => { if(e.key==="Escape" && tipFor){ const t=tipFor; hideTip(); if(t.focus) t.focus(); } });
addEventListener("scroll", () => { if(tipFor && document.activeElement!==tipFor) hideTip(); }, {passive:true, capture:true});

/* ---------- theme: same button, key and "auto" default as the project reports ---------- */
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function applyTheme(t){
  if(t==="auto")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
  document.documentElement.dataset.theme=t;
  document.getElementById("thm").setAttribute("aria-label",t==="dark"?"Switch to light theme":"Switch to dark theme");
}
document.getElementById("thm").addEventListener("click",()=>{
  const t=document.documentElement.dataset.theme==="dark"?"light":"dark";
  try{localStorage.setItem("kp-thm",t)}catch(e){} applyTheme(t)});
applyTheme(lsGet("kp-thm")||"auto");
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>applyTheme(lsGet("kp-thm")||"auto"));

/* ---------- sticky offset, measured ---------- */
const appbar = document.getElementById("appbar");
const setH = () => document.documentElement.style.setProperty("--appbar-h", appbar.offsetHeight + "px");
if("ResizeObserver" in window) new ResizeObserver(setH).observe(appbar); setH();

const mainEl = document.querySelector("main");
function render(){
  renderToolbar();
  const S = inView();
  renderHero(S); renderRows(S); renderEPC(S); renderSC(S);
  mainEl.style.minHeight = Math.max(parseFloat(mainEl.style.minHeight)||0, mainEl.offsetHeight) + "px";
}
document.getElementById("asof").textContent = "Data as of " + dLong(P.map(p=>p.statusIso).sort()[0]);
render();
</script>
